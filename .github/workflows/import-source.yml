name: Import verified source snapshot
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify and unpack reviewed project sources
        run: |
          echo 'b3dca25f4372b78099668bcebbb573055629c280cff7e8ab9496ba21be58b452  source-snapshot.zip' | sha256sum --check
          python - <<'PY'
          import zipfile, pathlib
          allowed = {'README.md', 'DOMAIN.md', 'RELEASE-NOTES.md', '.gitignore', 'package.json', 'package-lock.json', 'build-site.mjs', 'content.json', 'index.html'}
          with zipfile.ZipFile('source-snapshot.zip') as archive:
              assert len(archive.infolist()) == 45
              for entry in archive.infolist():
                  parts = pathlib.PurePosixPath(entry.filename).parts
                  assert not entry.filename.startswith('/') and '..' not in parts
                  assert entry.filename in allowed or parts[0] in {'lyra-client', 'lyra-admin', 'test'}
                  assert not any(p in {'.git', '.env', 'node_modules', 'data'} for p in parts)
                  assert entry.file_size < 2_000_000
              archive.extractall('.')
          server = pathlib.Path('lyra-admin/server.mjs')
          text = server.read_text()
          text = text.replace('let created;', 'let created, failure, publishedVersion;')
          text = text.replace('res.json({ ok: true, version: candidate.version });', 'publishedVersion = candidate.version;')
          text = text.replace('; next(error); }', '; failure = error; }')
          before = "finally { await Promise.all((req.files || []).map(f => fs.rm(f.path, { force: true }))); busy = false; }"
          after = "finally { const cleanup = await Promise.allSettled((req.files || []).map(f => fs.rm(f.path, { force: true }))); busy = false; for (const result of cleanup) if (result.status === 'rejected') console.error('Upload cleanup failed:', result.reason.message); } if (failure) next(failure); else res.json({ ok: true, version: publishedVersion });"
          assert before in text
          server.write_text(text.replace(before, after))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm test
      - run: npm ci && npm test && npm run build
        working-directory: lyra-client
      - run: npm ci && npm test
        working-directory: lyra-admin
      - name: Commit complete source tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md DOMAIN.md RELEASE-NOTES.md .gitignore package.json package-lock.json build-site.mjs content.json index.html lyra-client lyra-admin test
          git rm source-snapshot.zip
          git commit -m 'Add complete launcher, admin, tested publishing service and documentation'
          git push origin HEAD:main
