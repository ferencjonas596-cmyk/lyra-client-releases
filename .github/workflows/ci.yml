name: Test Lyra projects
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            lyra-client/package-lock.json
            lyra-admin/package-lock.json
      - run: npm ci && npm test
      - run: npm ci && npm test && npm run build
        working-directory: lyra-client
      - run: npm ci && npm test
        working-directory: lyra-admin
